[project]
name = "serve-llm"
version = "0.1.0"
description = "One model, two engines: quantized llama.cpp on a laptop CPU vs. vLLM on a cloud GPU."
readme = "PLAN.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "huggingface_hub>=0.30",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Only needed to run llama.cpp's convert_hf_to_gguf.py (HF weights -> GGUF).
# Pins mirror requirements/requirements-convert_hf_to_gguf.txt at the pinned llama.cpp tag;
# the converter imports the matching gguf-py from the llama.cpp source tree.
convert = [
    "torch==2.11.0",
    "transformers==4.57.6",
    "numpy~=2.2.6",
    "sentencepiece>=0.1.98,<0.3.0",
    "protobuf>=4.21.0,<5.0.0",
    "pyyaml>=5.1",
    "tqdm>=4.27",
    "requests>=2.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serve_llm"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
