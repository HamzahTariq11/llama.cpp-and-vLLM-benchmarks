name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Default groups only (dev): the GGUF converter's torch group is not needed for tests.
      # No models are downloaded; tests use captured llama.cpp output and mocked HTTP.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
